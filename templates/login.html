<!DOCTYPE html>
<html>
<head>
    <title>Login - Digital Mentor</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            background-color: #172554;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            background-color: white;
            width: 400px;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 12px #ddd;
            border-top: 6px solid #2563eb;
        }

        h1 {
            color: #172554;
            margin-bottom: 10px;
        }

        p {
            color: #333;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #172554;
        }

        a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .links {
            margin-top: 20px;
            line-height: 2;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>Welcome Back!</h1>

        <p>Login to Digital Mentor-Mentee System</p>

        <form method="POST" action="{{ url_for('login') }}">

            <input type="email" name="email" placeholder="Enter Email" required>

            <input type="password" name="password" placeholder="Enter Password" required>

            <button type="submit">Login</button>

        </form>

        <div class="links">
            <p>Don't have an account?
            <a href="/register">Register Here</a></p>

            <a href="/">← Back to Home</a>
        </div>

    </div>

</body>
</html>
