
<!DOCTYPE html>
<html>
<head>
    <title>Feedback</title>
    <style>
        body {
            background: #172554;
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            max-width: 500px;
            margin: auto;
            border-radius: 12px;
        }

        textarea {
            width: 90%;
            height: 120px;
            padding: 10px;
            margin: 15px;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Share Your Feedback</h1>

    <form method="POST">
        <textarea name="message"
                  placeholder="Write your feedback..."
                  required></textarea>
        <br>
        <button type="submit">Submit Feedback</button>
    </form>

    <br>
    <a href="javascript:history.back()">Back to Dashboard</a>
</div>

</body>
</html>
